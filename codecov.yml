# Codecov configuration.
#
# Nothing uploads coverage any more. Everything Codecov measured lived in the web client
# under legacy-web/, and the workflow that ran its tests and pushed the lcov report is gone
# (docs/kotlin/CI.md §1d). The Kotlin build reports no coverage yet.
#
# So the statuses are off rather than the file deleted. A project/patch status with nothing
# to compare against does not quietly skip — it blocks, or it sits pending forever, and
# either way it is a red mark on a pull request that has nothing to do with the change in
# it. Turning them off says the same thing honestly.
#
# When the Kotlin build does report coverage, turn these back on and give them its paths —
# `flags` and `component_management` were pointed at legacy-web/packages and have been
# dropped rather than re-aimed, because the module layout on this side is not the same one.
coverage:
  status:
    project: false
    patch: false

comment: false
