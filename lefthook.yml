pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx}'
      run: npx nx affected --target=lint --fix=true --files={staged_files} --no-error-on-unmatched-pattern
      staged_fixed: true
    lint:
      glob: '*.{ts,tsx,js,jsx}'
      run: npx nx format:write --files={staged_files}
      staged_fixed: true
    # Static analysis for the Kotlin side. The TypeScript commands above run lint and format
    # and see nothing in kmp/, so a detekt failure could be — and was — committed straight
    # past. maxIssues is 0, so this either passes or names the file.
    #
    # Scoped by glob so it costs nothing on a TypeScript-only commit, and runs the whole
    # detekt task rather than only the staged files: detekt analyses per module, and a
    # violation is just as real when it arrives in a file the commit did not touch.
    detekt:
      glob: 'kmp/**/*.{kt,kts}'
      run: cd kmp && ./gradlew detekt
