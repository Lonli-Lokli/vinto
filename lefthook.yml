# Pre-commit hooks.
#
# The Kotlin build is the repository root. The npm hooks that used to run here belonged to
# the web client under legacy-web/, which is on its way out (docs/kotlin/CI.md §1d):
# nothing in CI builds it any more, so nothing at commit time should either.

# **A hook that cannot run must stop the commit, not wave it through.**
#
# The hook lefthook generates tries a dozen ways to find its own binary and, when every one
# misses, prints `Can't find lefthook in PATH` and exits **0** — so the commit lands
# unchecked, and the single line saying why scrolls past inside the output of a commit that
# looks like it worked.
#
# That is not hypothetical. It is what happened on the commit before this one: a hook was
# installed, every lookup missed, and git carried on. Nothing was actually skipped that time
# — the commit touched no Kotlin, and `detekt` below is glob-scoped — which is precisely the
# problem with it. The first commit to be waved through in a way that mattered would have
# looked exactly the same.
#
# This turns that branch into `exit 1`. The failure is then loud, and its fix is one command
# that `npm install` already runs (`prepare` in package.json).
assert_lefthook_installed: true

pre-commit:
  commands:
    # Static analysis for the Kotlin side. maxIssues is 0, so this either passes or names
    # the file. Scoped by glob so it costs nothing on a commit that touches no Kotlin, and
    # it runs the whole detekt task rather than only the staged files: detekt analyses per
    # module, and a violation is just as real when it arrives in a file the commit did not
    # touch.
    detekt:
      glob: '*.{kt,kts}'
      run: ./gradlew detekt

    # Every locale against the English source. Globbed on the resource files, so it costs
    # nothing on a commit that touches no strings — and, more to the point, it costs nothing
    # to *remember*, which is what it was relying on until now.
    #
    # It is here rather than only in CI because of what it catches that the Kotlin suites do
    # not. `TranslationShapeTest` and `StringEscapeTest` cover the arguments a line takes and
    # the `\'` escape, and both run in `kmp-android`; nothing anywhere covered `%%` or a
    # double-escaped entity, and `%%` is not hypothetical — it reached a store screenshot in
    # twenty locales at once, because every translator faithfully copied the source's escape.
    #
    # The whole file set, not the staged files: a locale is checked against the source, so
    # "which files did this commit touch" is the wrong question to ask of it.
    translations:
      glob: '*strings.xml'
      run: node tools/check-translations.mjs
