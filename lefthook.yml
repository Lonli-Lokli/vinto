# Pre-commit hooks. The Kotlin build is the repository root; the retired web client is a
# frozen npm workspace under legacy-web/ and is only linted when something there changes.
pre-commit:
  # Deliberately sequential: the two npm commands both rewrite the staged files.
  commands:
    # Static analysis for the Kotlin side. maxIssues is 0, so this either passes or names
    # the file. Scoped by glob so it costs nothing on a commit that touches no Kotlin, and
    # it runs the whole detekt task rather than only the staged files: detekt analyses per
    # module, and a violation is just as real when it arrives in a file the commit did not
    # touch.
    detekt:
      glob: '*.{kt,kts}'
      run: ./gradlew detekt
    format:
      root: 'legacy-web/'
      glob: '*.{ts,tsx,js,jsx}'
      run: npx nx format:write --files={staged_files}
      staged_fixed: true
    lint:
      root: 'legacy-web/'
      glob: '*.{ts,tsx,js,jsx}'
      run: npx nx affected --target=lint --fix=true --files={staged_files} --no-error-on-unmatched-pattern
      staged_fixed: true
