schema: spec-driven

# Project context — shown to the AI when creating/updating OpenSpec artifacts.
context: |
  ## Purpose
  Vinto is a strategic multiplayer card game: one human vs three MCTS-driven bots
  (every game is exactly 4 players). Players minimise their hand total; a player who believes
  they are lowest calls "Vinto", the others form a coalition for one final round, and the
  round is scored caller-vs-lowest-coalition-hand.

  Long-term goal: a native mobile game (Android + iOS) on Kotlin Multiplatform + Compose
  Multiplatform, sharing one engine between clients and a future multiplayer server. The
  TypeScript implementation is the reference: every rule, edge case and reproducible
  recorded game must behave identically in Kotlin (see change
  migrate-to-kotlin-multiplatform, which depends on add-game-recording-replay).

  ## Tech stack (current — Kotlin, and it is what ships)
  - Kotlin 2.1 Multiplatform: jvm, android, js(IR), wasmJs, iOS (arm64/simulator/x64 on macOS)
  - Compose Multiplatform: one commonMain for Android, iOS and web
  - Gradle (Kotlin DSL) at the repository root, JDK 17 toolchain, conventions in build-logic
    (vinto.kmp.library); detekt + detekt-formatting at maxIssues 0; Kover for coverage
  - shared/shapes: Card, Rank, GameState, GameAction, canonical JSON, SHA-256, Prng
  - shared/engine: GameEngine.reduce, ActionValidator, one handler per action, replay
  - shared/bot: MCTS decision service, coalition planner, BotRunner
  - shared/client: GameSession — LocalGameSession (solo, no socket) and RemoteGameSession
  - shared/protocol: the wire, declared once. shared/room: room + registry cores
  - composeApp: the UI. worker: Cloudflare Worker + one Durable Object per room (Kotlin/JS)
  - Libraries in use are only: kotlinx.serialization, kotlinx.coroutines, Compose, kotlin.test.
    NO DI container — Koin was in the original plan and was never adopted; construction is
    explicit. NO Ktor/JVM server — the authority is a Durable Object (design D1, D9).

  ## Retired (legacy-web/, being deleted)
  - The Next.js/MobX/Nx client is frozen and on its way out; its CI is already removed.
    fixtures/ stays at the root and Kotlin keeps replaying it, but once legacy-web goes the
    corpus can no longer be regenerated — a frozen gate against drift rather than live
    evidence that two engines agree.

  ## Architecture rules
  - Single source of truth: GameState is immutable and authoritative; UI stores hold UI state only.
  - Pure engine: reducers have no side effects, no async, no ambient randomness or clocks.
    All randomness comes from GameState.rngState (seeded mulberry32 PRNG); engine ids and
    history timestamps are derived from state.
  - Actions as data: every interaction is a serialisable JSON GameAction; bots dispatch
    through the same path as humans.
  - Visual vs logical state: bots react to visual (post-animation) state only.
  - Reproducibility: a game is fully described by (initialState, actions[]); a
    GameRecording JSON (format v1) replays in any implementation to identical states
    (canonical JSON + SHA-256 per action). Recording fixtures live in fixtures/recordings/
    and are the cross-implementation parity gate.

  ## Conventions
  - TypeScript: kebab-case files, named exports, one component per file, interface over
    type, copy() for state updates, feature-oriented folders.
  - Kotlin: data class / sealed interface for state and actions, pure functions in the
    engine, no platform APIs in shared modules, JSON field names identical to TypeScript.
  - Git: master is main; the Kotlin migration lives on `kotlin` (not yet merged); issue
    branches issue-{N}. lefthook pre-commit runs ./gradlew detekt on Kotlin changes.
    Never bypass hooks; commit only when asked.

  ## Testing
  - Engine: unit tests per handler + rules/scenario tests (SCENARIOS.md is the spec).
  - Bot: deterministic parts (heuristics, coalition planner) tested exactly; MCTS statistically.
  - Client: adapter integration tests with fake timers / virtual time.
  - Parity: replay every committed recording through the engine; hashes after every action
    must match. Kotlin runs it on the JVM and inside workerd. The TypeScript direction goes
    when legacy-web/ does.
  - commonTest runs on JVM, JS, wasmJs and the iOS simulator — kmp-jvm, kmp-web and kmp-ios.
    A green JVM run does not imply a green Worker: Kotlin/JS carries Long as two Ints and
    uses a different serialization backend.

  ## Domain
  - Deck 52 + 2 Jokers. Values: 2–6 face, 7=7, 8=8, 9=9, 10=10, J/Q=10, K=0, A=1, Joker=−1.
  - Actions: 7/8 peek own; 9/10 peek opponent; J swap two cards of two players; Q peek two
    then optional swap; K declare a card's rank → the card leaves the hand and its action
    plays; A force-draw.
  - Toss-in: after any discard anyone may toss matching-rank cards; wrong rank → penalty;
    the Vinto caller cannot toss in.
  - Final round: each non-caller gets one turn; coalition may not target the caller;
    coalition wins iff lowest coalition total < caller total (tie → caller).

  ## Product decisions (2026-08)
  - Exactly one bot engine: v1 (MCTS) vs v2 (strategic) is decided by a TypeScript
    tournament before the Kotlin port; the loser is deleted; botVersion goes away.
  - Every game is exactly 4 players, no exceptions (no player-count setting anywhere).
  - Play with humans: 1 human vs 3 bots offline; 2–4 humans online in a 4-seat room with
    bots filling empty seats; all-human tables of 4. Server-authoritative **Cloudflare Worker
    + one Durable Object per room** running the same shared engine and bots; clients receive
    per-seat redacted PlayerViews. Guest identity only; hot-seat on one device is out of scope.
  - Single player never touches the network: no room, no token, no socket (§6d).
  - Crash reporting: Sentry, planned and not yet built (tasks 8.2, 9.9). Kept a separate pipe
    from analytics on purpose.
  - Analytics: a release gate, not a nice-to-have — openspec/changes/add-live-analytics
    phases 1-4 must land before the room opens. No cookies, no identifiers, GPC/DNT honoured.
  - End state is a single (Kotlin) game engine; the web follow-up change retires the
    TypeScript engine after the parity gate.

  ## Constraints
  - Engine determinism is mandatory (replay/parity, future server authority).
  - Bot search must not block the UI thread on mobile.
  - Mobile UI: light/dark themes, accessibility semantics.
  - The web app stays on the TypeScript engine until the Kotlin engine passes the parity gate.

rules:
  proposal:
    - Always state which other changes this change depends on
    - Include a "Non-goals" line
  specs:
    - Every requirement uses SHALL/MUST and has at least one scenario
    - Requirements about engine behaviour must be verifiable by replaying a recording
  design:
    - Prefer choices that are trivially implementable identically in TypeScript and Kotlin
  tasks:
    - Group tasks by phase; parity/verification tasks are explicit checkboxes

operations:
  apply:
    guidance:
      - Run the affected Nx project tests (nx test <project>) and lint before marking a task done
      - Never run npx tsc; use nx build @vinto/game to typecheck across packages
      - Any engine behaviour change must keep fixtures/recordings replaying (or regenerate them with a justification)
  archive:
    guidance:
      - Summarize which specs were created/updated and any fixture regeneration performed
