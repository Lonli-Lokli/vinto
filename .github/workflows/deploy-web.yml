# Publishing the website, from a phone.
#
# `vinto.kupalinka.app` did not exist for the life of this branch. Not "was broken" — there
# was no DNS record, because the web client had no deploy path at all: the portfolio's shared
# tooling mirrors a `web/` module layout this repository does not have, and hand-copying its
# two scripts here would have made Vinto the third copy of files the brief warns about
# copying (`docs/kotlin/README.md` §6c). So the client compiled and there was nowhere to put
# it. This is that verification living in CI instead of in a script somebody pastes.
#
# **It publishes a Worker, not a Pages project**, and the reason is this workflow's own
# purpose. A Pages custom domain can only be attached in the Cloudflare dashboard —
# `wrangler pages` has no command for it — so the hostname would have stayed behind "somebody
# has to open a browser" on a project whose entire point is a button in the GitHub mobile
# app. A Worker claims its hostname from `routes` in `composeApp/cloudflare/wrangler.jsonc`,
# exactly as `vinto-room.kupalinka.app` already does. The Pages deployment worked and is
# simply superseded; `deploy-room.yml` is its sibling and they now work the same way.
#
# **A push to `master` that touches the client publishes it**, alongside the manual trigger.
# That reverses the original rule ("deploying is a decision, not a consequence of merging"), on
# request, and what it buys is that `master` and the running site cannot drift apart. The
# manual trigger stays for redeploying without a code change and for the dry run.
#
# **This file has to be on `master` as well as here.** GitHub only offers "Run workflow" for
# a `workflow_dispatch` workflow that exists on the *default* branch. `deploy-room.yml` was
# written, pushed to a feature branch, and did not appear in the dropdown at all; keep the two
# copies of this one in step, or the button runs a version nobody edited. The tree it builds
# lives on `kotlin`, so set the branch dropdown accordingly — a preflight step says so rather
# than letting Gradle fail about a missing project.
#
# **Never construct the address you verify.** The first run of the Pages version of this
# workflow published perfectly and then reported failure, because it polled a hostname it had
# built out of the project name — a name that belonged to somebody else's project. The
# address is read from configuration and from what wrangler says, never assembled.
name: Deploy web

on:
  # Only the paths that can change what the site serves. `shared/**` is here and in
  # `deploy-room.yml` both, deliberately: the engine is one module and a change to it changes
  # the client and the server together, so both should publish.
  push:
    branches: [master]
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/deploy-web.yml'

  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Build, hash and measure the bundle without publishing anything.'
        type: boolean
        default: false

# One deploy at a time, and later runs win. Two overlapping `wrangler deploy` calls against
# one Worker is a race whose loser is whichever version happens to land second.
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  # Pinned for the same reason `kmp.yml` and `deploy-room.yml` pin it: `wrangler@latest` in CI
  # means the day Cloudflare ships a change is the day a deploy fails on a commit that has
  # nothing to do with it. Keep the three files in step.
  WRANGLER_VERSION: '4.127.1'
  WRANGLER_SEND_METRICS: 'false'
  CONFIG_DIR: 'composeApp/cloudflare'
  DIST: 'composeApp/build/dist/wasmJs/productionExecutable'

jobs:
  deploy:
    name: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # A GitHub environment, so the account owner can require an approval before this runs and
    # can see every deploy in one list afterwards. It shares the `room` environment's secrets
    # because it is the same Cloudflare account and the same API token.
    environment: room

    steps:
      - uses: actions/checkout@v6

      # Which branch you ran this from matters, and getting it wrong fails deep in a Gradle
      # build with an error about a missing project rather than about the ref.
      - name: Check this ref has the app in it
        run: |
          if [ ! -d composeApp ]; then
            echo "::error::No composeApp/ on ref '${{ github.ref_name }}'. Run this workflow from the branch that carries the Kotlin build (currently 'kotlin'), using the branch dropdown on the Run workflow panel."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          validate-wrappers: true

      # The shell's own gate, before anything is built. It reads `wasmJsMain/resources` off
      # the disk and costs seconds; a broken `og:image` or a missing icon is much cheaper to
      # learn about here than from a link that unfurls into nothing.
      - name: 'Gate: the web shell'
        run: ./gradlew --stacktrace :composeApp:jvmTest --tests '*WebShellTest*'

      - name: Build the Compose/Wasm client
        run: ./gradlew --stacktrace :composeApp:wasmJsBrowserDistribution

      # Content-addressing, and this is the step the whole workflow exists around.
      #
      # The `kupalinka.app` zone's Browser Cache TTL *overrides* a weaker origin
      # `Cache-Control` (README §6c), so a fixed-name script is cached past the deploy that
      # replaces it — and because the Kotlin/Wasm toolchain already content-hashes the `.wasm`
      # files, a stale `composeApp.js` keeps naming a binary that is no longer there. That is
      # a 404 and a dead page, not a stale one, and it has taken portfolio sites down before.
      # The `.wasm` half is handled by the toolchain; this is the half that is not.
      - name: Content-address the script
        id: hash
        run: |
          cd "$DIST"
          hash=$(sha256sum composeApp.js | cut -c1-16)
          mv composeApp.js "composeApp.$hash.js"
          # The source map travels with it, so a stale map cannot be served against a fresh
          # script either. The `sourceMappingURL` comment inside the bundle is rewritten to
          # match, or DevTools quietly fetches a map that is no longer there.
          mv composeApp.js.map "composeApp.$hash.js.map"
          sed -i "s|sourceMappingURL=composeApp.js.map|sourceMappingURL=composeApp.$hash.js.map|" "composeApp.$hash.js"
          # And the page. `WebShellTest` holds the `src` to a single plain attribute on one
          # line precisely so this substitution is exact rather than a guess at HTML.
          sed -i "s|src=\"composeApp.js\"|src=\"composeApp.$hash.js\"|" index.html
          grep -q "composeApp.$hash.js" index.html || { echo "::error::the script tag was not rewritten"; exit 1; }
          echo "script=composeApp.$hash.js" >> "$GITHUB_OUTPUT"
          echo "Script is now composeApp.$hash.js"

      # The address comes out of the committed configuration, so the verification below checks
      # the hostname this deploy is actually claiming rather than one assembled from a name.
      - name: Read the site's address from the config
        id: site
        run: |
          host=$(grep -oE '"pattern"[[:space:]]*:[[:space:]]*"[^"]+"' "$CONFIG_DIR/wrangler.jsonc" \
                 | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          [ -n "$host" ] || { echo "::error::no route pattern in $CONFIG_DIR/wrangler.jsonc"; exit 1; }
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "This deploy claims https://$host"

      - name: Measure what is about to be published
        run: |
          cd "$DIST"
          total=$(du -sb . | cut -f1)
          # awk rather than bc, which is not guaranteed to be on the runner image.
          gz=$(for f in *.js *.wasm; do gzip -c "$f" | wc -c; done | awk '{n += $1} END {print n}')
          {
            echo "### Bundle"
            echo ""
            echo "| | bytes |"
            echo "| --- | ---: |"
            printf '| on disk | %s |\n' "$(numfmt --to=iec "$total")"
            printf '| over the wire (gzipped js + wasm) | %s |\n' "$(numfmt --to=iec "$gz")"
            echo ""
            echo "Files:"
            echo '```'
            ls -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What would have been deployed
        if: ${{ inputs.dryRun }}
        run: |
          {
            echo "Dry run: nothing was published."
            echo ""
            echo "It would have gone to https://${{ steps.site.outputs.host }}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the Worker
        if: ${{ !inputs.dryRun }}
        working-directory: composeApp/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No CLOUDFLARE_API_TOKEN on the 'room' environment. See DEPLOYMENT.md section 6a."
            exit 1
          fi
          # The first deploy creates the DNS record for the custom domain, which needs zone
          # permissions on kupalinka.app and not only Workers ones — the same thing the room's
          # first deploy needed (README §6d).
          npx --yes wrangler@${WRANGLER_VERSION} deploy

      # Propagation is not atomic. §6d records that catching the maintainer out twice on the
      # room Worker, and §6c records the static-hosting version of the same hazard.
      #
      # So this does not ask "is it up". It asks whether the page being served names *this*
      # build's script, which is a question only the new deploy can answer correctly, and it
      # probes with a cache-buster because §6c says in as many words never to point anything
      # at a fresh deploy without one.
      #
      # A first deploy also has to wait for DNS and for a certificate, which is slower than a
      # redeploy — hence the generous budget rather than the room's.
      - name: Wait for the edge to serve this build
        if: ${{ !inputs.dryRun }}
        env:
          SCRIPT: ${{ steps.hash.outputs.script }}
          HOST: ${{ steps.site.outputs.host }}
        run: |
          site="https://$HOST"
          for attempt in $(seq 1 40); do
            body=$(curl -sS --max-time 15 "$site/?cb=$RANDOM$attempt" || true)
            if printf '%s' "$body" | grep -q "$SCRIPT"; then
              echo "attempt $attempt: serving $SCRIPT"

              # The script it names is really there — the check that would have caught the
              # stale-name failure this whole workflow is built to prevent.
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$site/$SCRIPT?cb=$RANDOM")
              [ "$code" = "200" ] || { echo "::error::the page names $SCRIPT and the edge answers $code for it"; exit 1; }

              # A missing path must be a 404 rather than the shell with a 200 on it. That is
              # `not_found_handling: "404-page"` plus the committed `404.html`; on Pages this
              # came back 200 text/html, which is why it is checked rather than assumed.
              missing=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$site/no-such-file-$RANDOM.js")
              [ "$missing" = "404" ] \
                && echo "a missing asset answers 404" \
                || echo "::warning::a missing asset answers $missing, not 404 — check not_found_handling and 404.html"

              # And an invitation link must still reach the app rather than that 404 page.
              invite=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$site/r/ABC123")
              [ "$invite" = "200" ] \
                || echo "::warning::an invitation path answers $invite — check _redirects"

              {
                echo "### Published"
                echo ""
                echo "**$site**"
                echo ""
                echo "* script: \`$SCRIPT\`"
                echo "* a missing asset answers: $missing (should be 404)"
                echo "* an invitation path answers: $invite (should be 200)"
                echo ""
                echo "The custom domain is claimed by \`routes\` in"
                echo "\`composeApp/cloudflare/wrangler.jsonc\`, so there is no dashboard step."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: not yet"
            sleep 15
          done
          echo "::error::$site never served $SCRIPT. The upload itself may have succeeded — check the deploy step. On a first deploy this can also be DNS or the certificate still being issued for $HOST."
          exit 1
