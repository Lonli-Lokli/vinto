# The retired web client, under legacy-web/.
#
# This was the repository's only CI until the Kotlin Multiplatform build took the root
# (`kmp.yml`). The TypeScript engine and bot are not dead code: they are the other half of
# the cross-implementation parity gate, and `fixtures/recordings` — the corpus the Kotlin
# engine is checked against — is generated from them. So their tests keep running, and they
# run whenever the corpus changes too, because a regenerated fixture that the TypeScript
# engine can no longer replay is the one failure that would invalidate both engines at once.
#
# Path-filtered: a Kotlin-only change has no business paying for an `npm ci`.
#
# The `build` job that used to live here is gone. `nx build @vinto/game` has failed at
# HEAD since before this branch — `<Html> should not be imported outside of pages/_document`
# while prerendering /404, reproducible with plain `next build` (docs/kotlin/README.md §7) —
# and a job that has never been green gates nothing; it only teaches people to ignore a red
# check. The app is frozen and deploys from Vercel, not from here. If the web client is ever
# picked back up, fix the export and restore the job in the same change.
name: Legacy web

on:
  push:
    branches: [master, test, kotlin]
    paths:
      - 'legacy-web/**'
      - 'fixtures/**'
      - 'codecov.yml'
      - '.github/workflows/legacy-web.yml'
  pull_request:
    paths:
      - 'legacy-web/**'
      - 'fixtures/**'
      - 'codecov.yml'
      - '.github/workflows/legacy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: legacy-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for accurate coverage reports

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          # The workspace is no longer at the root, so the cache key has to be pointed at it.
          cache-dependency-path: legacy-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      # `files` and `path` on these two are resolved from the repository root, not from
      # `defaults.run.working-directory`.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./legacy-web/coverage/**/lcov.info
          flags: unittests
          name: codecov-vinto
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: legacy-web/coverage/
          retention-days: 30
          if-no-files-found: ignore
