# Deploying the room, from a phone.
#
# The room Worker has only ever been deployable from a machine with `wrangler login` and the
# maintainer's browser session. That is a poor place for the one operation this project cannot
# do without: it means online play can be broken on a Sunday and stay broken until somebody is
# back at a desk. This workflow is the same deploy, run by GitHub with a scoped API token, and
# started from the Actions tab — which works from the GitHub mobile app.
#
# **This file has to be on `master` as well as here.** GitHub only offers "Run workflow" for a
# `workflow_dispatch` workflow that exists on the *default* branch — a workflow living only on
# a feature branch never appears in the Actions dropdown at all, which is how this was found.
# It went to `master` on its own in a one-file pull request; keep the two copies in step, or
# the button runs a version nobody edited.
#
# **A push to `master` that touches the room deploys it.** That reverses the original rule here
# ("deploying is a decision, not a consequence of merging"), on request, and the trade is worth
# stating: what it buys is that `master` and the running service cannot drift, which is exactly
# the failure that had already happened — the committed `ROOM_OPEN` said `false` for months
# while the live room was open, because the flag had only ever been passed on the command line.
#
# **That drift is also what made a push trigger dangerous**, so it was fixed before this was
# added. `wrangler.jsonc` now says `"true"`, and a push deploys the config **as written**
# without passing `--var` at all. Had it not been fixed, the first unrelated commit to touch
# `shared/` would have closed a room people were playing in, silently.
#
# Closing the room is therefore a committed change to that line, or a manual run with the
# choice set. `workflow_dispatch` is kept for exactly that, and for redeploying without a code
# change.
name: Deploy room

on:
  # Only the paths that can change what the room runs. `shared/**` is here and in
  # `deploy-web.yml` both, deliberately: the engine is one module and a change to it changes
  # the client and the server together.
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - 'shared/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/deploy-room.yml'

  workflow_dispatch:
    inputs:
      roomOpen:
        description: 'Open the room to players? Leave blank to deploy whatever wrangler.jsonc says.'
        type: choice
        options: ['', 'false', 'true']
        default: ''
        required: false
      dryRun:
        description: 'Build and measure the bundle without publishing anything.'
        type: boolean
        default: false

# One deploy at a time, and later runs win. Two overlapping `wrangler deploy` calls against one
# Worker is a race whose loser is whichever version happens to land second.
concurrency:
  group: deploy-room
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  # Pinned for the same reason `kmp.yml` pins it: `wrangler@latest` in CI means the day
  # Cloudflare ships a change is the day a deploy fails, on a commit that has nothing to do
  # with it. Keep the two files in step.
  WRANGLER_VERSION: '4.127.1'
  WRANGLER_SEND_METRICS: 'false'
  SERVICE: 'https://vinto-room.kupalinka.app'

jobs:
  deploy:
    name: deploy-room
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A GitHub environment, so the account owner can require an approval before this runs and
    # can see every deploy in one list afterwards. Nothing breaks if the environment has no
    # protection rules — it is then just a label — which is why the secrets live on it rather
    # than on the repository.
    environment: room

    steps:
      - uses: actions/checkout@v6

      # The same guard `deploy-web.yml` carries, and it matters more now there is a push
      # trigger: the paths above do not exist on `master` until the Kotlin branch merges, so
      # these triggers are inert until then — but a manual run from the wrong branch would
      # otherwise fail deep in Gradle with an error about a missing project rather than a
      # sentence about the ref.
      - name: Check this ref has the worker in it
        run: |
          if [ ! -d worker/cloudflare ]; then
            echo "::error::No worker/cloudflare on ref '${{ github.ref_name }}'. Run this from the branch that carries the Kotlin build (currently 'kotlin')."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          validate-wrappers: true

      # Nothing is deployed that has not passed the room's own gates first. They run in plain
      # Node against the compiled exports and take under a minute, which is a cheap price for
      # never publishing a room that cannot deal a hand. The three that need `wrangler dev`
      # stay in `kmp.yml`: they want a running runtime, and this job is about the one that is
      # about to be running for real.
      - name: Compile the Kotlin/JS Worker bundle
        run: ./gradlew --stacktrace :worker:jsProductionExecutableCompileSync

      - name: 'Gate: the real room'
        working-directory: worker/cloudflare
        run: node gate-real-room.mjs

      - name: 'Gate: room lifecycle'
        working-directory: worker/cloudflare
        run: node gate-lifecycle.mjs

      - name: 'Gate: the room-code registry'
        working-directory: worker/cloudflare
        run: node gate-registry.mjs

      # The size budget, before the upload rather than after it. A Worker that is over its
      # limit fails at the very end of a deploy, having already spent the minutes above.
      - name: Measure the deployment bundle
        working-directory: worker/cloudflare
        run: |
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --outdir /tmp/worker-bundle
          gzip -c /tmp/worker-bundle/index.js | wc -c | awk '{
            printf "gzipped: %d bytes (%.1f%% of the 3 MB budget)\n", $1, $1 / 3145728 * 100
            if ($1 > 3145728) { print "over budget"; exit 1 }
          }'

      # One place decides what the door should be, so the deploy and the check that follows it
      # cannot disagree. A manual run may override it; a push never does — it publishes the
      # committed config, which is the whole point of letting a push deploy at all.
      #
      # This replaces an earlier arrangement where the flag was *only* ever passed on the
      # command line, "instead of living in a file where it can be committed by accident". The
      # reasoning was sound and the consequence was worse: the committed file said `false`
      # while the live room was open, for months, and nothing could see the disagreement.
      - name: What the door should be
        id: door
        run: |
          chosen='${{ inputs.roomOpen }}'
          if [ -n "$chosen" ]; then
            echo "var=--var ROOM_OPEN:$chosen" >> "$GITHUB_OUTPUT"
            echo "want=$chosen" >> "$GITHUB_OUTPUT"
            echo "This run overrides the committed flag: ROOM_OPEN=$chosen"
          else
            want=$(grep -oE '"ROOM_OPEN"[[:space:]]*:[[:space:]]*"(true|false)"' \
                   worker/cloudflare/wrangler.jsonc | grep -oE '(true|false)' | tail -1)
            if [ -z "$want" ]; then
              echo "::error::no ROOM_OPEN in worker/cloudflare/wrangler.jsonc"
              exit 1
            fi
            echo "var=" >> "$GITHUB_OUTPUT"
            echo "want=$want" >> "$GITHUB_OUTPUT"
            echo "Deploying the committed config: ROOM_OPEN=$want"
          fi

      - name: What would have been deployed
        if: ${{ inputs.dryRun }}
        run: |
          echo "Dry run: nothing was published." >> "$GITHUB_STEP_SUMMARY"
          echo "ROOM_OPEN would have been \`${{ steps.door.outputs.want }}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        if: ${{ !inputs.dryRun }}
        working-directory: worker/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No CLOUDFLARE_API_TOKEN on the 'room' environment. See DEPLOYMENT.md section 6a."
            exit 1
          fi
          npx --yes wrangler@${WRANGLER_VERSION} deploy ${{ steps.door.outputs.var }}

      # Propagation is not atomic, and §6d records it catching the maintainer out twice: a
      # probe seconds after `wrangler deploy` returned the *old* behaviour and sent them
      # chasing a bug that did not exist. So this polls until the edge agrees, and fails if it
      # never does — a deploy that reports success while the old code is still answering is
      # worse than one that reports failure.
      - name: Wait for the edge to agree
        if: ${{ !inputs.dryRun }}
        run: |
          want='${{ steps.door.outputs.want }}'
          for attempt in $(seq 1 30); do
            health=$(curl -sS --max-time 10 "$SERVICE/health" || echo '{}')
            echo "attempt $attempt: $health"
            if echo "$health" | grep -q "\"roomOpen\":$want"; then
              {
                echo "### Room deployed"
                echo ""
                echo '```json'
                echo "$health"
                echo '```'
                echo ""
                if [ "$want" = 'true' ]; then
                  echo "**The room is open.** Anybody with a code can join, and public rooms are listed."
                else
                  echo "The room is deployed and **closed**: \`/health\` and \`/replay\` answer, a socket is refused."
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/health never reported roomOpen=$want. The deploy may still be propagating; check $SERVICE/health before running this again."
          exit 1
