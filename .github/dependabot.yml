# Dependabot configuration.
#
# Two ecosystems, and the one that used to be here is gone. The `npm` block watched `/`,
# which stopped having a `package.json` when the Kotlin build took the repository root and
# the web client moved to `legacy-web/` — so it had been resolving nothing for a while, and
# the app it served is being deleted (docs/kotlin/CI.md §1d). Nothing under
# `worker/cloudflare` has a manifest either; wrangler is run through `npx` at a version the
# workflow pins.
#
# What replaces it is the ecosystem that was never here: `gradle`. Kotlin, AGP, Compose
# Multiplatform, coroutines, serialization and detekt are the dependencies this repository
# actually builds against, and until now none of them could be updated by anything but a
# person remembering to look.

version: 2
updates:
  # The Kotlin build. Dependabot reads `gradle/libs.versions.toml` as well as the build
  # files, which is where every version in this repository is declared.
  - package-ecosystem: "gradle"
    directory: "/"
    # Dependabot opens pull requests against the **default** branch unless told otherwise,
    # and the default branch is `master`, which does not contain `gradle/libs.versions.toml`
    # — or any part of the Kotlin build. So this block was resolving nothing, in exactly the
    # way the `npm` block it replaced was resolving nothing, and for the same reason: the
    # build it watches lives somewhere it was not looking. That is why the versions here had
    # drifted three Kotlin lines and four Compose Multiplatform lines behind without a single
    # pull request being opened about it.
    #
    # Remove this line when `kotlin` merges to `master`; leaving it pointed at a branch that
    # no longer exists is the same failure again, in the other direction.
    target-branch: "kotlin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "kotlin"
      - "automated"
    reviewers:
      - "Lonli-Lokli"
    groups:
      # Kotlin and the plugins pinned to its version move together or not at all.
      # `composeCompiler` is declared as `version.ref = "kotlin"`, and Compose Multiplatform
      # tracks a Kotlin range — a PR that raises one and not the others does not compile, and
      # a reviewer should not have to discover that from a red check.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
          - "org.jetbrains.kotlinx:kotlinx-serialization*"
          - "org.jetbrains.compose*"
      # AGP and the androidx artifacts Compose Multiplatform pulls in.
      android:
        patterns:
          - "com.android*"
          - "androidx.*"
      tooling:
        patterns:
          - "io.gitlab.arturbosch.detekt*"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    reviewers:
      - "Lonli-Lokli"
