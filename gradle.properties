# Heap sizes are pinned rather than left to the host default so the build behaves the same
# on every machine. Two different tasks have each forced a rise here, and the second one is the
# reason this block is long.
#
# The Compose/Wasm production compile was the first: on an 8 GB machine it failed with "Not
# enough memory to run compilation" on the Kotlin daemon's default heap, while the same task had
# succeeded on a larger box.
#
# THE SECOND IS THE iOS RELEASE FRAMEWORK, and it is worth writing down how it was diagnosed
# because two plausible fixes are both wrong. `linkReleaseFrameworkIosArm64` dies with
# `java.lang.OutOfMemoryError: Java heap space` inside `DevirtualizationAnalysis` — the release
# framework's whole-program optimisation, which builds a constraint graph over every function
# that survives into the binary and is by a wide margin the largest allocation this build makes.
#
# The obvious fixes are `kotlin.daemon.jvmargs` and `kotlin.native.jvmArgs`. **Neither does
# anything here.** Listing the JVMs while the link runs shows only Gradle daemons — the
# Kotlin/Native compiler is running IN-PROCESS inside the Gradle daemon, so the only ceiling it
# has is the line below. Raising either of the other two changes nothing at all, which looks
# exactly like "not enough yet" and invites raising them again.
#
# It had never been hit because **no iOS RELEASE build had ever been run**. Debug and the
# simulator link with the optimisation off, so `kmp-ios` in CI is green and an App Store archive
# is the first thing that ever asks for it.
#
# 5g on an 8 GB machine: enough for the link, with room left for the OS. The rest of the
# portfolio's games run at 3g and never met this, which is a fair measure of how much more code
# reaches an iOS binary here — the engine, the MCTS bot and the whole Compose UI.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g

# The JVM compile daemon, which is a different process from the one above and compiles Kotlin for
# the JVM/JS targets. Left where it was: nothing has ever needed it higher, and the iOS link that
# looked like it did was the Gradle daemon all along.
kotlin.daemon.jvmargs=-Xmx3g

kotlin.code.style=official

# Compose Multiplatform's Android artifacts are AndroidX; this is required, not optional.
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Build performance -------------------------------------------------------------------
#
# Both are safe for this build and both are worth having on CI, where every job starts from
# a cold(ish) daemon and pays for whatever it recomputes.
#
# `parallel` runs independent modules at once; the module graph here is wide (six shared
# modules with no dependencies between most of them) which is exactly the shape that wins.
# `caching` lets a task be satisfied from a previous run's output — the Gradle build cache
# is what the CI cache actually restores, so without it the cache is only the dependency
# jars.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The configuration cache is ON.
#
# It was off, and the note here said why: Kotlin Multiplatform and AGP 8.10 both emitted
# configuration-cache violations, and a half-working configuration cache produces failures
# that look like code bugs. It said "revisit when both are clean; measure before believing it
# helps." This is the revisit, and both are.
#
# Measured across everything CI runs — detekt, the shared modules' JVM suites, a jsNodeTest,
# the Worker's production bundle, :composeApp:assembleDebug and the Compose UI suite. Every
# one stores an entry with zero problems reported.
#
# And it helps: a no-op :composeApp:assembleDebug went from 40 seconds to 1.4, which is most
# of the edit-build loop that is not actual compilation.
#
# If problems come back — a new plugin, a task reading the environment at execution time —
# read the report rather than turning this off. It names the task and the line, and the fix
# is usually a provider where a value was captured eagerly.
