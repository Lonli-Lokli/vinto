# SwiftLint — the Swift quality gate for the iOS app, and the analogue of detekt on the Kotlin
# side. There is very little Swift here on purpose: an entry point, the Compose bridge, and the
# two link handlers. That is the whole surface, so it can afford to be linted strictly.
#
#   swiftlint                 lint
#   swiftlint --fix           autocorrect
#
# Install with `brew install swiftlint`. The Xcode build phase skips with a warning when it is
# absent, so a contributor without it can still build.

included:
  - iosApp/iosApp

excluded:
  - build
  - iosApp/build
  - iosApp/iosApp.xcodeproj

# **Every rule SwiftLint ships**, which is the same standard `config/detekt/detekt.yml` holds
# the Kotlin side to. `all` rather than a list, so a new SwiftLint version's new rules arrive
# switched on rather than waiting for somebody to notice them.
opt_in_rules:
  - all

# Where this project disagrees with a rule, the disagreement is written here — the same bargain
# detekt gets, and the reason there is no inline `swiftlint:disable` anywhere in the Swift.
disabled_rules:
  # Wants `{` on a line of its own, which is the opposite of what Swift is written like
  # everywhere including Apple's own samples — and the opposite of `opening_brace`, a rule that
  # is on by default and enforces the brace on the declaration line. The two cannot both hold.
  - contrasted_opening_brace

  # Want `internal` spelled out on every declaration. This is an app target, not a library: there
  # is no other module to be internal *to*, so the keyword would be 58 lines of noise saying what
  # the default already says. The Kotlin side does not spell it either.
  - explicit_acl
  - explicit_top_level_acl

  # `ComposeView` is a six-line bridge used by exactly one view, in the file that uses it. A file
  # of its own would be a file nobody opens except to find the other half.
  - one_declaration_per_file

line_length:
  # The Swift here is mostly comment, and the comments explain decisions rather than restating
  # signatures — which runs long. Warn late, never error.
  warning: 120
  error: 200
  ignores_comments: true

identifier_name:
  min_length: 1 # short, idiomatic names — `url`, `id`
  excluded: [id, url]

type_name:
  min_length: 3
  # `iOSApp` is the standard Xcode/KMP @main entry-struct name (lowercase leading `i`), and
  # renaming it to satisfy a linter would make this project the odd one in the portfolio.
  excluded: [iOSApp]

reporter: "xcode"
