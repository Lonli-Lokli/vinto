[versions]
# Verified on JVM and Android here — 653 shared tests, 124 Compose tests, detekt clean over
# every module — and on Kotlin/JS, Wasm and Native by CI, which are the three targets a
# Kotlin bump most affects and the three this container cannot build (codeload.github.com
# answers 403, and there is no Mac).
#
# Kotlin 2.4 warns that Gradle 8.14 is deprecated and that 2.5 will require 8.14.4. That is
# the next thing to move, and it is small.
kotlin = "2.4.10"
kotlinxSerialization = "1.10.0"
kotlinxCoroutines = "1.11.0"
# 1.12.0, and the version it forced everything else to. Its Android artifacts require
# **compileSdk 37** and **AGP 9.1+**, AGP 9 requires **Gradle 9**, and AGP 9 refuses to let
# `com.android.application` share a module with the KMP plugin — which is why `androidApp`
# exists. The whole chain is one change, and this line is its head.
composeMultiplatform = "1.12.0"
# 8.13.2 is the head of the 8.x line. **Not 9.x**, and that is a decision rather than a lag:
# AGP 9 wants Gradle 9, and the thing most likely to break on Gradle 9 is detekt, which is
# this build's `maxIssues: 0` release gate and whose 1.x line ends at 1.23.8 — its successor
# is `dev.detekt:...:2.0.0-alpha.6`. Putting a release gate on an alpha, on an unmerged
# migration branch, would make every future red check ambiguous between "the migration broke"
# and "the toolchain moved". See docs/kotlin/README.md §7.
agp = "9.3.2"
androidxActivityCompose = "1.10.1"
# 1.23.8 is the last 1.x line, and it is **not** the thing holding the toolchain back —
# measured under Kotlin 2.4.10, 129 files analysed, zero findings. This build runs detekt
# without type resolution, so it parses rather than resolves and does not care which compiler
# produced the source. Its successor is `dev.detekt:...:2.0.0-alpha.6`, and there is no reason
# to put a `maxIssues: 0` gate on an alpha yet.
detekt = "1.23.8"
kover = "0.9.9"

# Android API levels. minSdk 24 matches Compose Multiplatform's floor and covers ~97% of
# devices; there is nothing in this app that would justify dropping older phones further.
androidCompileSdk = "37"
androidMinSdk = "24"
androidTargetSdk = "37"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
# The Android target of a KMP module, since AGP 9 refuses `com.android.library` beside it.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
