[versions]
kotlin = "2.1.21"
kotlinxSerialization = "1.8.1"
kotlinxCoroutines = "1.10.2"
composeMultiplatform = "1.8.0"
# 8.13.2 is the head of the 8.x line. **Not 9.x**, and that is a decision rather than a lag:
# AGP 9 wants Gradle 9, and the thing most likely to break on Gradle 9 is detekt, which is
# this build's `maxIssues: 0` release gate and whose 1.x line ends at 1.23.8 — its successor
# is `dev.detekt:...:2.0.0-alpha.6`. Putting a release gate on an alpha, on an unmerged
# migration branch, would make every future red check ambiguous between "the migration broke"
# and "the toolchain moved". See docs/kotlin/README.md §7.
agp = "8.13.2"
androidxActivityCompose = "1.10.1"
# 1.23.8 is the last 1.x line; it runs on Kotlin 2.1 for the rules used here.
detekt = "1.23.8"
kover = "0.9.1"

# Android API levels. minSdk 24 matches Compose Multiplatform's floor and covers ~97% of
# devices; there is nothing in this app that would justify dropping older phones further.
androidCompileSdk = "36"
androidMinSdk = "24"
androidTargetSdk = "36"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
