<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- DISCARD: a card tipped over and dropping onto the pile, an arrow beside it saying which way.
       Tilted, so it cannot be mistaken for Draw's card standing upright over the deck. -->
  <!-- One pen for every mark in the set: 2 of 24, round ends and joins, black, no fill — the
       pill tints it to its own ink, so the mark is the button's colour in both themes. -->
  <path d="M4.5 18.5 H19.5 A1.5 1.5 0 0 1 21 20 V20.5 A1.5 1.5 0 0 1 19.5 22 H4.5 A1.5 1.5 0 0 1 3 20.5 V20 A1.5 1.5 0 0 1 4.5 18.5 Z" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M7.7 4.9 L16.2 1.8 L20.3 13.1 L11.8 16.2 Z" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M4 2.5 V11" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1.8 8.8 L4 11 L6.2 8.8" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
