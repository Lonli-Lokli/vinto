<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- LEAVE THEM: the two cards a Jack or a Queen was aimed at, standing still on the table line.
       Swap's two cards without its arrows, beside which it is offered. -->
