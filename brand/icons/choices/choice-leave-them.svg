  <path d="M14.5 4 H19.5 A1.5 1.5 0 0 1 21 5.5 V14.5 A1.5 1.5 0 0 1 19.5 16 H14.5 A1.5 1.5 0 0 1 13 14.5 V5.5 A1.5 1.5 0 0 1 14.5 4 Z" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M2 20 H22" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
