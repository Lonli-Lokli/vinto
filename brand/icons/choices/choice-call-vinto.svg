  <path d="M17.28 4.08 A2.64 2.64 0 0 1 17.28 9.36" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 13.92 V17.76" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M7.2 17.76 H16.8 V20.64 H7.2 Z" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
