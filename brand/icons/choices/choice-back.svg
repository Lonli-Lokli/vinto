<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- BACK: an arrow that turns back on itself, to the question that was being asked before.
       Not a chevron, which is what Continue is: the two must not be one mark the other way round. -->
  <!-- One pen for every mark in the set: 2 of 24, round ends and joins, black, no fill — the
       pill tints it to its own ink, so the mark is the button's colour in both themes. -->
  <path d="M4.5 10 H14.5 A5.5 5.5 0 0 1 14.5 21 H9" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.5 5 L3.5 10 L8.5 15" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
