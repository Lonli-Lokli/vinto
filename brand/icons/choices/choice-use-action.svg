<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- USE THE ACTION: the drawn card, and the spark of its action at its corner.
       The same spark as Use from the pile, without the pile under the card. -->
