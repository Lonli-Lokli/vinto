  <path d="M17.5 1.6 V4.4 M17.5 7.6 V10.4 M13.1 6 H15.9 M19.1 6 H21.9" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
