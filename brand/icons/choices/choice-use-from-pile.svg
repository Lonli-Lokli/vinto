<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- USE FROM THE PILE: the unplayed card off the discard pile, with the spark that means "its
       action" beside it. Offered beside Draw, so it carries the spark where Draw carries an arrow. -->
