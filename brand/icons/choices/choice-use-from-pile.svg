  <path d="M4.5 3 H11.5 A1.5 1.5 0 0 1 13 4.5 V14.5 A1.5 1.5 0 0 1 11.5 16 H4.5 A1.5 1.5 0 0 1 3 14.5 V4.5 A1.5 1.5 0 0 1 4.5 3 Z" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18.5 2.1 V4.9 M18.5 8.1 V10.9 M14.1 6.5 H16.9 M20.1 6.5 H22.9" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
