<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- DONE: a tick, and nothing else. What has been shown has been seen. -->
  <!-- One pen for every mark in the set: 2 of 24, round ends and joins, black, no fill — the
       pill tints it to its own ink, so the mark is the button's colour in both themes. -->
  <path d="M4.5 12.5 L9.5 17.5 L19.5 6.5" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
