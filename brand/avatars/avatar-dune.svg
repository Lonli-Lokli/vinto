<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- DUNE — EARTH. Three lines lying down and dead straight: strata, the layers a cut bank
       shows. Straight against water's roll is the whole distinction, so these do not waver at
       all — a slight curve here would cost the pair their difference at 44 dp.
       Earth is drawn brown as often as green, and brown is what it has to be: the felt is
       #1B5E43, and a green disc on green felt has no edge. The deck's GOLD_DARK, so the disc and
       the brighter gold hairline above it read as one family. -->
  <path d="M512 10 A502 502 0 1 0 512 1014 A502 502 0 1 0 512 10 Z" fill="#8A6D1B" stroke="#14181B" stroke-width="20"/>
  <path d="M300 392 L724 392" fill="none" stroke="#F7F5EF" stroke-width="56" stroke-linecap="round"/>
  <path d="M276 512 L748 512" fill="none" stroke="#F7F5EF" stroke-width="56" stroke-linecap="round"/>
  <path d="M300 632 L724 632" fill="none" stroke="#F7F5EF" stroke-width="56" stroke-linecap="round"/>
</svg>
