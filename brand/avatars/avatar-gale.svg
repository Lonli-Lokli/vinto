<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- GALE — AIR. Three lines lying down and curling away at the end: a gust, not a stratum.
       The curl is what separates air from earth, so it is a full hook rather than a flick.
       Air is white, and a white disc cannot hold the paper-coloured line the other three use, so
       this one inverts: a pale slate disc drawn in the deck's INK. Same reasoning as DUNE's
       darker gold — the family is the shape and the ring, not one fixed pair of colours. -->
  <path d="M512 10 A502 502 0 1 0 512 1014 A502 502 0 1 0 512 10 Z" fill="#B9C6CC" stroke="#14181B" stroke-width="20"/>
  <path d="M292 392 L616 392 C684 392 684 300 624 316" fill="none" stroke="#14181B" stroke-width="56" stroke-linecap="round"/>
  <path d="M276 512 L648 512" fill="none" stroke="#14181B" stroke-width="56" stroke-linecap="round"/>
  <path d="M292 632 L616 632 C684 632 684 724 624 708" fill="none" stroke="#14181B" stroke-width="56" stroke-linecap="round"/>
</svg>
